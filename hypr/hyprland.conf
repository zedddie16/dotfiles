monitor = eDP-1, 1920x1080@144, 0x0,1
monitor = HDMI-A-1, 1920x1080@240, 1920x0, 1
$terminal = kitty
$yazifileManager = yazi
$menu = wofi --show drun
$browser = zen-browser

exec-once = ctvtcntr
exec-once = [workspace 1 silent; move 0 0] ticktick
exec-once = [workspace 1 silent; move 0 0] spotify
exec-once = [workspace 2 silent] $browser
exec-once = [workspace 2 silent; float; move cursor -50% -50%] blueman-manager
exec-once = [workspace 2 silent] kitty
exec-once = [workspace 3 silent] obsidian
exec-once = [workspace 4 silent] telegram-desktop
exec-once = waybar & hyprpaper
exec-once=systemctl --user start plasma-polkit-agent
exec-once=dunst
exec-once=nm-applet --indicator
exec-once=mcontrolcenter &
exec-once=swww-daemon &
# exec-once = gsettings set org.gnome.desktop.interface cursor-theme Kitty
# exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
# exec-once = flatpak override --filesystem=~/.themes:ro --filesystem=~/.icons:ro --user
# exec-once = hyprctl setcursor Kitty 24
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0 # Integrated GPU as primary renderer
env = HYPRCURSOR_THEME,Bibata-Modern-Amber
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24 
general { 
   gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgb(B6A0FF)
    col.inactive_border = rgba(B6A0FF39)  
    resize_on_border = false 
    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 15
    active_opacity = 1
    inactive_opacity = 1
    blur {
        enabled = true
        size = 2
        passes = 5
        vibrancy = 4
    }
    shadow {
        enabled = true
    }
}
blurls = ^waybar$
animations {
    enabled = false
    first_launch_animation = true

    bezier = ease, 0.25, 0.1, 0.25, 1.0
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsIn, 1, 6, default, slide left 55.1337%
    animation = windowsOut, 1, 7, default, slide right 55%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 2, default
}
dwindle {
    pseudotile = true
    preserve_split = true 
}
master {
    new_status = master
}
misc { 
    vfr = true
    middle_click_paste = false
    force_default_wallpaper =  0 
    disable_hyprland_logo = true 
}
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =
    follow_mouse = 1
    force_no_accel = true
    sensitivity = 0 
    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
    }
}
gestures {
    workspace_swipe = true
}
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
$mainMod = SUPER # Sets "Windows" key as main modifier
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
# bind = $mainMod, M, exit,
bind = $mainMod, E, exec, yazi 
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, 
bind = $mainMod, B, exec, $browser 
bind = $mainMod, space, exec, rofi -show drun
bind = $mainMod, F, fullscreen 
bind = $mainMod Ctrl, F, fullscreen, 1 
bind = $mainMod, ESCAPE, exec, hyprlock
bind = $mainMod Ctrl, S, exec, grim -g "$(slurp)" - | wl-copy
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, F10, workspace, e+1
bind = $mainMod, F11, workspace, e-1
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod SHIFT, o, exec, killall waybar
bind = $mainMod SHIFT, p, exec, waybar &
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d
bind = $mainMod , right, resizeactive, 30 0
bind = $mainMod , left, resizeactive, -30 0
bind = $mainMod , up, resizeactive, 0 -30
bind = $mainMod , down, resizeactive, 0 30
bind = $mainMod, N, exec, ~/dev/scripts/wallpaper_cycle.sh
bind = $mainMod, W, exec, ~/dev/scripts/toggle_waybar.sh
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
windowrulev2 = suppressevent maximize, class:.* 

workspace = 4, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, rounding:false, decorate:false, gapsin:0, gapsout:0, border:false, monitor:HDMI-A-1, default:true
workspace = 1, rounding:true, decorate:true, gapsin:0, gapsout:25, border:true, monitor:eDP-1, default:true

windowrule = opacity 1.0 override 0.9 override 0.95 override, class:Spotify
windowrule = rounding 15 opacity 1.0 override 0.6 override 0.95 override, class:blueman-manager
