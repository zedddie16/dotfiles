background_opacity 0.7
font_family JetBrainsMono Nerd Font Mono extraBold



# BEGIN_KITTY_THEME
# pink lavender
include current-theme.conf
# END_KITTY_THEME

# TABS
tab_bar_style powerline
tab_powerline_style slanted
# to open tabs press CTRL SHIFT T 
# to close tabs press CTRL SHIFT Q
# for navigating between them use CTRL SHIFT arrows

# MAP KEYS
map F1 new_window_with_cwd

map F2 launch --cwd=current /usr/bin/nvim .
